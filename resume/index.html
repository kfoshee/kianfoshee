<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume - Kian Foshee</title>
  <meta name="description" content="Kian Foshee's resume: software engineer, founder, and research contributor.">
  <link rel="canonical" href="https://kianfoshee.com/resume">
  <meta property="og:title" content="Resume - Kian Foshee">
  <meta property="og:description" content="Software Engineer | Founder | Research Contributor">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://kianfoshee.com/resume">
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style>
    :root, [data-theme="light"] {
      --bg: #f3f1ec;
      --text: #24211e;
      --muted: #746e67;
      --rule: #ddd8d0;
      --accent: #9b2c2c;
      --accent-hover: #7f2222;
      --accent-text: #ffffff;
      --shadow: 0 18px 50px rgba(45, 39, 32, 0.10), 0 2px 8px rgba(45, 39, 32, 0.06);
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg: #171513;
      --text: #eee9e2;
      --muted: #aaa198;
      --rule: #3c3732;
      --accent: #db7357;
      --accent-hover: #e48165;
      --accent-text: #171513;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.34), 0 2px 8px rgba(0, 0, 0, 0.22);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    a { color: inherit; }
    .page {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }
    .document-shell {
      display: block;
      border: 0;
      background: #fff;
      color: inherit;
      text-decoration: none;
    }
    .resume-document {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 20px;
    }
    .actions { display: flex; align-items: center; gap: 8px; }
    .button, .theme-toggle {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--rule);
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      text-decoration: none;
      transition: border-color 0.18s ease, background-color 0.18s ease, color 0.18s ease;
    }
    .button { padding: 0 14px; }
    .button:hover, .theme-toggle:hover { border-color: var(--muted); }
    .button-primary { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
    .button-primary:hover { border-color: var(--accent-hover); background: var(--accent-hover); }
    .back-link { border-color: transparent; padding-left: 0; color: var(--muted); font-weight: 500; }
    .back-link:hover { border-color: transparent; color: var(--text); }
    .theme-toggle { width: 40px; padding: 0; cursor: pointer; }
    .sun, [data-theme="dark"] .moon { display: none; }
    [data-theme="dark"] .sun { display: block; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (max-width: 640px) {
      .page { width: min(100% - 24px, 920px); padding: 12px 0 28px; }
      .controls { align-items: flex-start; flex-direction: column; margin-top: 14px; }
      .actions { width: 100%; }
      .actions .button { flex: 1; }
      .back-link { min-height: 32px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="document-shell" href="./kian-foshee-resume.pdf?v=latex-2026-3" target="_blank" rel="noopener" aria-label="Open Kian Foshee's LaTeX resume PDF">
      <img class="resume-document" src="./kian-foshee-resume.svg?v=latex-2026-3" alt="Kian Foshee's resume, rendered directly from LaTeX" width="612" height="792">
    </a>
    <nav class="controls" aria-label="Resume actions">
      <a class="button back-link" href="/">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><path d="M12.5 7.5H2.5M6.5 3.5L2.5 7.5L6.5 11.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Kian Foshee
      </a>
      <div class="actions">
        <a class="button" href="./kian-foshee-resume.pdf?v=latex-2026-3" target="_blank" rel="noopener">
          Open PDF
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M5 3H3.5C2.67 3 2 3.67 2 4.5V10.5C2 11.33 2.67 12 3.5 12H9.5C10.33 12 11 11.33 11 10.5V9M8 2H12V6M12 2L6.5 7.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a class="button button-primary" href="./kian-foshee-resume.pdf?v=latex-2026-3" download="Kian-Foshee-Resume.pdf">
          Download
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 1.5V9M4.25 6.5L7 9.25L9.75 6.5M2 12H12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <button class="theme-toggle" type="button" aria-label="Switch color theme">
          <svg class="moon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 10.05A5.75 5.75 0 015.95 2.5 5.76 5.76 0 1013.5 10.05Z" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="sun" width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="2.75" stroke="currentColor" stroke-width="1.25"/><path d="M8.5 1V2.25M8.5 14.75V16M16 8.5H14.75M2.25 8.5H1M13.8 3.2L12.9 4.1M4.1 12.9L3.2 13.8M13.8 13.8L12.9 12.9M4.1 4.1L3.2 3.2" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
        </button>
      </div>
    </nav>
  </main>
  <script>
    (function() {
      const root = document.documentElement;
      const toggle = document.querySelector('.theme-toggle');
      toggle.addEventListener('click', function() {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
