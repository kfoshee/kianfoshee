<html lang="en">
<head>

  <meta property="og:url" content="https://kianfoshee.com/resume">
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,16..72,400;0,16..72,500;0,16..72,600;1,16..72,400&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --bg: #f2ede2;
      --surface: rgba(250, 247, 240, 0.88);
      --solid: #faf7f0;
      --text: #1c1917;
      --muted: #6b6258;
      --rule: #d9d1be;
      --accent: #9b2c2c;
      --accent-hover: #771d1d;
      --button-text: #fffaf2;
      --stage: #ddd6c8;
      --shadow: 0 28px 70px rgba(50, 40, 29, 0.15), 0 3px 12px rgba(50, 40, 29, 0.08);
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg: #1b1612;
      --surface: rgba(27, 22, 18, 0.9);
      --solid: #231d18;
      --text: #ece3d2;
      --muted: #a59784;
      --rule: #3a3028;
      --accent: #e27b5a;
      --accent-hover: #ee8e6f;
      --button-text: #1b1612;
      --stage: #2b241e;
      --shadow: 0 28px 70px rgba(0, 0, 0, 0.38), 0 3px 12px rgba(0, 0, 0, 0.25);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: radial-gradient(circle at 12% 5%, color-mix(in srgb, var(--accent) 5%, transparent), transparent 31rem), var(--bg);
      font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    a { color: inherit; }
    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--rule);
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .nav, .page { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--muted);
      font-size: 18px;
    }
    .breadcrumb a {
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb svg { flex: 0 0 auto; color: var(--rule); }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .button, .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      border-radius: 999px;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 650;
      line-height: 1;
      text-decoration: none;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, color 0.18s ease;
    }
    .button { padding: 0 17px; border: 1px solid var(--rule); }
    .button:hover, .theme-toggle:hover { transform: translateY(-1px); }
    .button-secondary { background: transparent; color: var(--text); }
    .button-secondary:hover { border-color: var(--muted); background: var(--solid); }
    .button-primary { border-color: var(--accent); background: var(--accent); color: var(--button-text); }
    .button-primary:hover { border-color: var(--accent-hover); background: var(--accent-hover); }
    .theme-toggle {
      width: 42px;
      padding: 0;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .theme-toggle:hover { border-color: var(--muted); color: var(--text); }
    .sun, [data-theme="dark"] .moon { display: none; }
    [data-theme="dark"] .sun { display: block; }
    .page { padding: 66px 0 72px; }
    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 32px;
      margin-bottom: 34px;
    }
    .eyebrow {
      margin: 0 0 9px;
      color: var(--accent);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(52px, 7vw, 78px);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 0.98;
    }
    .subtitle {
      margin: 17px 0 0;
      color: var(--muted);
      font-size: clamp(18px, 2.4vw, 22px);
      line-height: 1.35;
    }
    .document-meta {
      flex: 0 0 auto;
      display: flex;
      gap: 9px;
      margin-bottom: 7px;
      color: var(--muted);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    .document-meta span + span::before { content: "\00b7"; margin-right: 9px; color: var(--rule); }
    .viewer {
      position: relative;
      overflow: hidden;
      padding: clamp(18px, 4vw, 48px);
      border: 1px solid var(--rule);
      border-radius: 22px;
      background: var(--stage);
    }
    .paper-link {
      position: relative;
      display: block;
      width: min(880px, 100%);
      margin: 0 auto;
      color: var(--text);
      text-decoration: none;
    }
    .paper-link::after {
      content: "Open full PDF \2197";
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: rgba(24, 22, 20, 0.82);
      color: #fff;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      font-weight: 650;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .paper-link:hover::after, .paper-link:focus-visible::after { opacity: 1; transform: translateY(0); }
    .resume-preview {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 2px;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .page-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-top: 24px;
      color: var(--muted);
      font-size: 16px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-weight: 500;
      text-underline-offset: 4px;
      text-decoration-thickness: 1px;
    }
    .back-link:hover { color: var(--accent); }
    .page-footer p { margin: 0; font-style: italic; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (max-width: 720px) {
      .nav, .page { width: min(100% - 32px, 1180px); }
      .nav { min-height: 68px; gap: 12px; }
      .breadcrumb { gap: 7px; font-size: 16px; }
      .nav-actions .button-secondary { display: none; }
      .button { min-height: 40px; padding: 0 14px; font-size: 13px; }
      .theme-toggle { width: 40px; min-height: 40px; }
      .page { padding: 44px 0 48px; }
      .hero { display: block; margin-bottom: 24px; }
      .document-meta { margin-top: 20px; margin-bottom: 0; }
      .viewer { margin-inline: -16px; padding: 12px; border-right: 0; border-left: 0; border-radius: 0; }
      .paper-link::after { content: "Open \2197"; top: 10px; right: 10px; opacity: 1; transform: none; }
      .page-footer { align-items: flex-start; flex-direction: column; }
    }
    @media (max-width: 430px) {
      .breadcrumb .current, .breadcrumb svg { display: none; }
      .nav-actions { gap: 7px; }
      .button-primary svg { display: none; }
      h1 { font-size: 52px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <script>
    (function() {
      const root = document.documentElement;
      const toggle = document.querySelector('.theme-toggle');
      toggle.addEventListener('click', function() {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
